name: Storage lab checks
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: Run 5000 small and 10 large files under both policies
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Create disposable CI credentials
        shell: pwsh
        run: ./scripts/init-env.ps1
      - run: docker compose build storage-node-1 ui
      - name: Start integration environment
        run: >-
          docker compose up -d --no-build --wait --wait-timeout 360
          postgres metadata-service storage-node-1 storage-node-2 storage-node-3
          storage-node-4 storage-node-5 storage-node-6 storage-node-7
          gateway-1 gateway-2 worker-1 worker-2 recovery-service elasticsearch ui
      - name: Pytest against actual storage services
        env:
          RUN_INTEGRATION: '1'
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - run: python scripts/test-http.py --phase crud
      - run: python scripts/test-http.py --phase search
      - run: python scripts/test-http.py --phase balance
      - run: python scripts/test-gateway-failover.py
      - name: Assignment-sized benchmark (manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.full_benchmark
        run: python benchmark_redundancy.py --profile full --output test-results/benchmark-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-test-results
          path: test-results/
      - if: failure()
        run: docker compose logs --tail 80
