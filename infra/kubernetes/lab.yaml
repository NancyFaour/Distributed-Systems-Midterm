---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: storage-lab
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: storage-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: storage-secrets
              key: GRAFANA_PASSWORD
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
          subPath: datasource.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
          subPath: provider.yaml
        - name: config
          mountPath: /var/lib/grafana/dashboards/storage.json
          subPath: storage.json
      volumes:
      - name: config
        configMap:
          name: grafana-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internal-only
  namespace: storage-lab
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ha
  namespace: storage-lab
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  bootstrap:
    initdb:
      database: storage
      owner: storage
      secret:
        name: storage-db-auth
  storage:
    size: 20Gi
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-operator
  namespace: storage-lab
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres-ha
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 5432
