apiVersion: v1
kind: Namespace
metadata:
  name: storage-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-config
  namespace: storage-lab
data:
  POSTGRES_HOST: postgres-ha-rw
  POSTGRES_PORT: '5432'
  METADATA_BACKEND: postgres
  HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
  METADATA_URL: http://metadata-service:8000
  STORAGE_NODES: '{"storage-0": "http://storage-0.storage-headless:8000", "storage-1":
    "http://storage-1.storage-headless:8000", "storage-2": "http://storage-2.storage-headless:8000",
    "storage-3": "http://storage-3.storage-headless:8000", "storage-4": "http://storage-4.storage-headless:8000",
    "storage-5": "http://storage-5.storage-headless:8000", "storage-6": "http://storage-6.storage-headless:8000",
    "storage-7": "http://storage-7.storage-headless:8000"}'
  INITIAL_STORAGE_NODES: '{"storage-0": "http://storage-0.storage-headless:8000",
    "storage-1": "http://storage-1.storage-headless:8000", "storage-2": "http://storage-2.storage-headless:8000",
    "storage-3": "http://storage-3.storage-headless:8000", "storage-4": "http://storage-4.storage-headless:8000",
    "storage-5": "http://storage-5.storage-headless:8000", "storage-6": "http://storage-6.storage-headless:8000"}'
  ELASTICSEARCH_URL: http://elasticsearch:9200
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: midterm
  JOB_QUEUE_ENABLED: 'true'
  SCRUB_INTERVAL_SECONDS: '60'
  ROOT_PATH: /api
  RATE_LIMIT_PER_MINUTE: '300'
  HEARTBEAT_TIMEOUT_SECONDS: '15'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-migrate
  namespace: storage-lab
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: distributed-storage-node:lab-b04fb6efde5f
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: storage-config
        - secretRef:
            name: storage-secrets
        command:
        - python
        - scripts/migrate.py
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-service
  namespace: storage-lab
spec:
  selector:
    app: metadata-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-service
  namespace: storage-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metadata-service
  template:
    metadata:
      labels:
        app: metadata-service
    spec:
      containers:
      - name: metadata-service
        image: distributed-storage-node:lab-b04fb6efde5f
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        envFrom: &id001
        - configMapRef:
            name: storage-config
        - secretRef:
            name: storage-secrets
        command:
        - python
        - -m
        - uvicorn
        - metadata_service:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      initContainers:
      - name: wait-for-schema
        image: distributed-storage-node:lab-b04fb6efde5f
        imagePullPolicy: IfNotPresent
        envFrom: *id001
        command:
        - python
        - -c
        - "import time\nfrom metadata_db import connect_db\nwhile True:\n    try:\n\
          \        with connect_db() as connection:\n            connection.execute('SELECT\
          \ content_type,tags FROM object_versions LIMIT 0')\n            connection.execute('SELECT\
          \ 1 FROM node_heartbeats LIMIT 0')\n            connection.execute('SELECT\
          \ 1 FROM maintenance_jobs LIMIT 0')\n        break\n    except Exception:\n\
          \        print('Waiting for metadata schema', flush=True)\n        time.sleep(3)\n"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-headless
  namespace: storage-lab
spec:
  selector:
    app: storage
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: storage-lab
spec:
  serviceName: storage-headless
  replicas: 7
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: storage
  template:
    metadata:
      labels:
        app: storage
    spec:
      containers:
      - name: storage
        image: distributed-storage-node:lab-b04fb6efde5f
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: storage-config
        - secretRef:
            name: storage-secrets
        command:
        - python
        - -m
        - uvicorn
        - storage_node:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: STORAGE_URL
          value: http://$(POD_NAME).storage-headless:8000
        - name: DATA_DIR
          value: /data
        volumeMounts:
        - name: data
          mountPath: /data
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
