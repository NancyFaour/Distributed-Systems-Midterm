    \    role: pod\n  relabel_configs:\n  - action: keep\n    regex: gateway\n   \
    \ source_labels:\n    - __meta_kubernetes_pod_label_app\n  - replacement: $1:8000\n\
    \    source_labels:\n    - __meta_kubernetes_pod_ip\n    target_label: __address__\n"
