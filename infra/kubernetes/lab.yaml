  provider.yaml: "apiVersion: 1\nproviders:\n- name: Storage\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
  storage.json: "{\n  \"uid\": \"storage-lab\",\n  \"title\": \"Distributed Object\
    \ Storage\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"10s\"\
    ,\n  \"time\": {\n    \"from\": \"now-30m\",\n    \"to\": \"now\"\n  },\n  \"\
    panels\": [\n    {\n      \"id\": 1,\n      \"type\": \"timeseries\",\n      \"\
    title\": \"Request throughput\",\n      \"gridPos\": {\n        \"x\": 0,\n  \
    \      \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(gateway_requests_total[2m]))\"\
    ,\n          \"legendFormat\": \"{{node}}\",\n          \"refId\": \"A\"\n   \
    \     }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"reqps\"\n        }\n      },\n      \"options\": {\n        \"\
    legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"\
    bottom\"\n        }\n      }\n    },\n    {\n      \"id\": 2,\n      \"type\"\
    : \"timeseries\",\n      \"title\": \"Request latency p95\",\n      \"gridPos\"\
    : {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\"\
    : 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n  \
    \      \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n  \
    \        \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(gateway_request_seconds_bucket[5m])))\"\
    ,\n          \"legendFormat\": \"{{node}}\",\n          \"refId\": \"A\"\n   \
    \     }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n       \
    \   \"unit\": \"s\"\n        }\n      },\n      \"options\": {\n        \"legend\"\
    : {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\
    \n        }\n      }\n    },\n    {\n      \"id\": 3,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Upload throughput\",\n      \"gridPos\": {\n        \"x\"\
    : 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      },\n    \
    \  \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\
