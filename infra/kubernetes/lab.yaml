    port: 5672
    targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: storage-lab
spec:
  selector:
    app: rabbitmq
  ports:
  - name: http
    port: 5672
    targetPort: 5672
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: storage-lab
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4-management
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: midterm
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: storage-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: +S 2:2 +A 4
        readinessProbe:
          tcpSocket: &id001
            port: 5672
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          tcpSocket: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
