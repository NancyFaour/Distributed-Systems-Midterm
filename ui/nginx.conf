upstream storage_gateways {
    zone storage_gateways 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    server ${GATEWAY_1_ADDRESS} resolve max_fails=1 fail_timeout=5s;
    server ${GATEWAY_2_ADDRESS} resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2g;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://storage_gateways/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        # Fail over a stopped/unreachable container before clients time out.
        # Keep the separate, longer read/send limits for large transfers.
        proxy_connect_timeout 2s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
    # Metrics/operational health are scraped inside the container network.
    location = /api/metrics { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
