name: distributed-systems-midterm
x-storage-node: &storage-node
  image: distributed-storage-node:local
  depends_on:
    metadata-service:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storage
      POSTGRES_DB: storage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U storage -d storage" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s
  rabbitmq:
    image: rabbitmq:4-management@sha256:d6e0b463f6b4e1e840da82f28aa117c00b1b6a3009b1f418bd270741de0d8871
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  prometheus:
    image: prom/prometheus:latest@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
  grafana:
    image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  metadata-service:
    image: distributed-storage-node:local
    command: ["python", "-m", "uvicorn", "metadata_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      METADATA_DATA_DIR: /data
      HEARTBEAT_TIMEOUT_SECONDS: "15"
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - metadata-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  storage-node-1:
    <<: *storage-node
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ID: node-1
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-1:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - storage-node-1-data:/data
  storage-node-2:
    <<: *storage-node
    environment:
      NODE_ID: node-2
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-2:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - storage-node-2-data:/data

  storage-node-3:
    <<: *storage-node
    environment:
      NODE_ID: node-3
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-3:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - storage-node-3-data:/data

  storage-node-4:
    <<: *storage-node
    environment:
      NODE_ID: node-4
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-4:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8004:8000"
    volumes:
      - storage-node-4-data:/data
  storage-node-5:
    <<: *storage-node
    environment:
      NODE_ID: node-5
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-5:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8005:8000"
    volumes:
      - storage-node-5-data:/data

  storage-node-6:
    <<: *storage-node
    environment:
      NODE_ID: node-6
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-6:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - storage-node-6-data:/data

  storage-node-7:
    <<: *storage-node
    environment:
      NODE_ID: node-7
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-7:8000
      HEARTBEAT_INTERVAL_SECONDS: "5"
    ports:
      - "127.0.0.1:8007:8000"
    volumes:
      - storage-node-7-data:/data

  recovery-service:
    image: distributed-storage-node:local
    command: ["python", "-m", "uvicorn", "recovery_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      SCRUB_INTERVAL_SECONDS: "20"
      STORAGE_NODES: '{"node-1":"http://storage-node-1:8000","node-2":"http://storage-node-2:8000","node-3":"http://storage-node-3:8000","node-4":"http://storage-node-4:8000","node-5":"http://storage-node-5:8000","node-6":"http://storage-node-6:8000","node-7":"http://storage-node-7:8000"}'
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8020:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kafka-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data:
  metadata-data:
  postgres-data:
  storage-node-5-data:
  storage-node-6-data:
  storage-node-7-data:
