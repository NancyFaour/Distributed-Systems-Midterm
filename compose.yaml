name: distributed-systems-midterm
x-storage-node:
  image: distributed-storage-node:local
  depends_on: &id001
    metadata-service:
      condition: service_healthy
  healthcheck: &id002
    test:
    - CMD
    - python
    - -c
    - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
      timeout=3)
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: storage
      POSTGRES_DB: storage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
    - 127.0.0.1:5433:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U storage -d storage
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
        2>&1
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 30s
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management@sha256:d6e0b463f6b4e1e840da82f28aa117c00b1b6a3009b1f418bd270741de0d8871
    hostname: rabbitmq
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:9090/-/ready
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
    - 127.0.0.1:3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?Set GRAFANA_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
    - grafana-data:/var/lib/grafana
    - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  metadata-service:
    image: distributed-storage-node:local
    command:
    - python
    - -m
    - uvicorn
    - metadata_service:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      METADATA_DATA_DIR: /data
      HEARTBEAT_TIMEOUT_SECONDS: '15'
      METADATA_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 127.0.0.1:8010:8000
    volumes:
    - metadata-data:/data
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  storage-node-1:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ID: node-1
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-1:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8001:8000
    volumes:
    - storage-node-1-data:/data
    restart: unless-stopped
  storage-node-2:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-2
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-2:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8002:8000
    volumes:
    - storage-node-2-data:/data
    restart: unless-stopped
  storage-node-3:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-3
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-3:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8003:8000
    volumes:
    - storage-node-3-data:/data
    restart: unless-stopped
  storage-node-4:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-4
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-4:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8004:8000
    volumes:
    - storage-node-4-data:/data
    restart: unless-stopped
  storage-node-5:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-5
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-5:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8005:8000
    volumes:
    - storage-node-5-data:/data
    restart: unless-stopped
  storage-node-6:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-6
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-6:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8006:8000
    volumes:
    - storage-node-6-data:/data
    restart: unless-stopped
  storage-node-7:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-7
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-7:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8007:8000
    volumes:
    - storage-node-7-data:/data
    restart: unless-stopped
  recovery-service:
    image: distributed-storage-node:local
    command:
    - python
    - -m
    - uvicorn
    - recovery_service:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000", "node-8": "http://storage-node-8:8000"}'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SCRUB_INTERVAL_SECONDS: '60'
      JOB_QUEUE_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
    - 127.0.0.1:8020:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  migrate:
    image: distributed-storage-node:local
    command:
    - python
    - scripts/migrate.py
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000", "node-8": "http://storage-node-8:8000"}'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INITIAL_STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000"}'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  gateway-1:
    image: distributed-storage-node:local
    command:
    - python
    - -m
    - uvicorn
    - gateway:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000", "node-8": "http://storage-node-8:8000"}'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      ROOT_PATH: /api
    depends_on:
      migrate:
        condition: service_completed_successfully
      metadata-service:
        condition: service_healthy
    healthcheck: &id003
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',
        timeout=3)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
  worker-1:
    image: distributed-storage-node:local
    command:
    - python
    - job_queue.py
    environment: &id004
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000", "node-8": "http://storage-node-8:8000"}'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  gateway-2:
    image: distributed-storage-node:local
    command:
    - python
    - -m
    - uvicorn
    - gateway:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HEARTBEAT_REGISTRY_URL: http://metadata-service:8000
      STORAGE_NODES: '{"node-1": "http://storage-node-1:8000", "node-2": "http://storage-node-2:8000",
        "node-3": "http://storage-node-3:8000", "node-4": "http://storage-node-4:8000",
        "node-5": "http://storage-node-5:8000", "node-6": "http://storage-node-6:8000",
        "node-7": "http://storage-node-7:8000", "node-8": "http://storage-node-8:8000"}'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      ROOT_PATH: /api
    depends_on:
      migrate:
        condition: service_completed_successfully
      metadata-service:
        condition: service_healthy
    healthcheck: *id003
    restart: unless-stopped
  worker-2:
    image: distributed-storage-node:local
    command:
    - python
    - job_queue.py
    environment: *id004
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    volumes:
    - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
    - 127.0.0.1:9200:9200
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s'
        >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: distributed-storage-ui:local
    ports:
    - 127.0.0.1:8080:80
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  storage-node-8:
    image: distributed-storage-node:local
    depends_on: *id001
    healthcheck: *id002
    environment:
      NODE_ID: node-8
      DATA_DIR: /data
      METADATA_URL: http://metadata-service:8000
      STORAGE_URL: http://storage-node-8:8000
      HEARTBEAT_INTERVAL_SECONDS: '5'
    ports:
    - 127.0.0.1:8008:8000
    volumes:
    - storage-node-8-data:/data
    profiles:
    - scale
    restart: unless-stopped
volumes:
  kafka-data: null
  rabbitmq-data: null
  prometheus-data: null
  grafana-data: null
  storage-node-1-data: null
  storage-node-2-data: null
  storage-node-3-data: null
  storage-node-4-data: null
  metadata-data: null
  postgres-data: null
  storage-node-5-data: null
  storage-node-6-data: null
  storage-node-7-data: null
  elasticsearch-data: null
  storage-node-8-data: null
